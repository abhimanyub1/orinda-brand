<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Orinda Labs</title>
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#080C16">
<link rel="icon" type="image/svg+xml" href="/assets/brand/orinda-labs-icon-dark.svg">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem('orinda-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  .doc { padding: 9rem 0 5rem; }
  .doc .wrap { max-width: 74ch; }
  .doc h1 { font-size: clamp(2rem,5vw,3rem); margin-bottom: .6rem; }
  .doc .updated { color: var(--text-faint); font-size: .85rem; margin-bottom: 2.5rem; }
  .doc h2 { font-size: 1.2rem; margin: 2.4rem 0 .7rem; }
  .doc p, .doc li { color: var(--text-dim); margin-bottom: .9rem; }
  .doc ul { list-style: disc; padding-left: 1.3rem; }
  .doc a { color: var(--blue); border-bottom: 1px solid currentColor; }
  .back { display:inline-flex; gap:.4rem; align-items:center; color: var(--text-dim); font-size:.9rem; margin-bottom:2rem; }
</style>
</head>
<body>
<main class="doc">
  <div class="wrap">
    <a class="back" href="/">&larr; Back to Orinda Labs</a>
    <h1>404 — page not found</h1>
    <p class="updated">That page does not exist.</p>
    <p>It may have moved, or the link may be wrong. Try the
    <a href="/">home page</a>, or <a href="/#contact">get in touch</a> and we will
    point you at the right place.</p>
    <p style="margin-top:3rem"><a href="/#contact">Questions? Contact us.</a></p>
  </div>
</main>
</body>
</html>
