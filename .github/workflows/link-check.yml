name: Link and markup check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links resolve
        run: |
          set -euo pipefail
          # Every href/src that starts with "/" must exist under src/.
          # Written to a file first so the failure count survives the pipeline.
          grep -rhoE '(href|src)="/[^"#?]*"' src/*.html \
            | sed -E 's/^(href|src)="//; s/"$//' \
            | sort -u > /tmp/links.txt
          missing=0
          while read -r p; do
            [ -z "$p" ] && continue
            [ "$p" = "/" ] && continue
            if [ ! -e "src${p}" ]; then
              echo "::error::Missing local asset: ${p}"
              missing=$((missing + 1))
            fi
          done < /tmp/links.txt
          if [ "$missing" -gt 0 ]; then
            echo "$missing broken internal link(s)."
            exit 1
          fi
          echo "All internal links resolve."

      - name: Report remaining TODO placeholders
        run: |
          set -euo pipefail
          if grep -rn "TODO:" src/ >/dev/null 2>&1; then
            echo "::warning::Placeholder content still present:"
            grep -rn "TODO:" src/ | sed 's/^/  /'
          else
            echo "No placeholders left."
          fi
