name: Site check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Content rules, entity facts, links and placeholders
        run: python3 scripts/site-check.py

      - name: Config files parse
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('config/site.json'))"
          python3 -c "import json; json.load(open('src/staticwebapp.config.json'))"
          python3 -c "import json; json.load(open('src/site.webmanifest'))"
          python3 -c "import xml.dom.minidom as m; m.parse('src/sitemap.xml')"
          echo "All config files parse."

  browser:
    name: Browser behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Serve src/ and run the suite
        run: |
          set -euo pipefail
          python3 -m http.server 8099 --directory src >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:8099/ && break
            sleep 1
          done
          node scripts/browser-test.mjs http://localhost:8099
